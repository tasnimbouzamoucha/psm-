<header id="page-topbar">
  <div class="layout-width">
    <div class="navbar-header">
      <div class="d-flex align-items-center">
        <button type="button" class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger"
                id="topnav-hamburger-icon" (click)="mobileMenuButtonClicked.emit()">
          <span class="hamburger-icon"><span></span><span></span><span></span></span>
        </button>
        <h5 class="mb-0 ms-2 d-none d-md-block text-muted fw-normal">SmartSoft Solutions</h5>
      </div>

      <div class="d-flex align-items-center">
        <div class="dropdown ms-sm-3 header-item topbar-user">
          <button type="button" class="btn" id="page-header-user-dropdown" (click)="dropdownOpen = !dropdownOpen">
            <span class="d-flex align-items-center">
              <span class="avatar-xs">
                <span class="avatar-title rounded-circle bg-primary text-uppercase fs-13">{{ initiales() }}</span>
              </span>
              <span class="text-start ms-xl-2">
                <span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text">{{ user()?.prenom }} {{ user()?.nom }}</span>
                <span class="d-none d-xl-block ms-1 fs-12 text-muted user-name-sub-text">{{ roleLabel() }}</span>
              </span>
            </span>
          </button>
          <div class="dropdown-menu dropdown-menu-end" [class.show]="dropdownOpen" style="right:0; top:100%">
            <h6 class="dropdown-header">Bienvenue {{ user()?.prenom }} !</h6>
            <span class="dropdown-item-text text-muted fs-12">{{ user()?.email }}</span>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" routerLink="/dashboard" (click)="dropdownOpen = false">
              <i class="mdi mdi-view-dashboard-outline text-muted fs-16 align-middle me-1"></i> Tableau de bord
            </a>
            <a class="dropdown-item" href="javascript:void(0)" (click)="logout()">
              <i class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i> Déconnexion
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
