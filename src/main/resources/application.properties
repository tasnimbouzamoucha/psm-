spring.application.name=psm
server.port=8080

# ===================== Base de données MySQL =====================
# La base psm_db est créée automatiquement si elle n'existe pas.
# Adapte username / password à ton MySQL (XAMPP/WAMP : root sans mot de passe)
spring.datasource.url=jdbc:mysql://localhost:3306/psm_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===================== Sécurité =====================
# true  = sécurité JWT active (étapes 4 à 7 du CDC)
# false = toutes les API ouvertes, pour tester le CRUD sans token (étapes 2-3)
app.security.enabled=true

# ===================== JWT =====================
# Clé secrète encodée en Base64 (min. 256 bits). Change-la en production.
jwt.secret=${JWT_SECRET:cHNtLXNtYXJ0c29mdC1zb2x1dGlvbnMtc2VjcmV0LWtleS1qd3QtMjAyNC1mdWxsc3RhY2s=}
# Durée de validité du token : 24 h (en millisecondes)
jwt.expiration=86400000

# ===================== CORS (Angular en dev) =====================
app.cors.allowed-origins=http://localhost:4200

# ===================== Email (Gmail SMTP) =====================
# Pour Gmail : active la validation en 2 étapes puis crée un "mot de passe d'application"
# https://myaccount.google.com/apppasswords  (16 caractères, sans espaces)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Adresse de l'admin qui reçoit la notification à chaque inscription
app.admin.email=tasnim.bouzamoucha@ensi-uma.tn

# Comptes créés automatiquement au premier démarrage
app.init.admin.email=tasnim.bouzamoucha@ensi-uma.tn
app.init.admin.password=admin123
app.init.collab.email=collab@psm.com
app.init.collab.password=collab123
